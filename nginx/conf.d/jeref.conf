#########################################
# jeref.com.ar – refrigeración industrial
# HTTPS enabled — cert: /etc/letsencrypt/live/jeref.com.ar/
# Issued: 2026-05-11  Expires: 2026-08-09
#########################################

# ── HTTP: ACME challenge + redirect to HTTPS ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name jeref.com.ar www.jeref.com.ar;

    # Let's Encrypt webroot challenge (required for cert renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jeref.com.ar$request_uri;
    }
}

# ── HTTPS: www → apex redirect ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jeref.com.ar;

    ssl_certificate     /etc/letsencrypt/live/jeref.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeref.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    return 301 https://jeref.com.ar$request_uri;
}

# ── HTTPS: canonical apex ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jeref.com.ar;

    ssl_certificate     /etc/letsencrypt/live/jeref.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jeref.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    root  /usr/share/nginx/frontend-static/jeref;
    index index.html;

    access_log /var/log/nginx/jeref.access.log;
    error_log  /var/log/nginx/jeref.error.log;

    # Full security headers — HSTS now active
    include /etc/nginx/snippets/seguridad.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
